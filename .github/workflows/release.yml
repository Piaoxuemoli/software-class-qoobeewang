name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: bash scripts/install-deps.sh

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('client/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Check version consistency
        run: bash scripts/release/check-version.sh "$GITHUB_REF_NAME"

      - name: Gate
        run: |
          cd client && npm ci && cd ..
          make check

      - name: Build backend release
        run: make backend-release

      - name: Package client (AppImage + deb)
        run: cd client && npm run package

      - name: Build docs PDFs
        run: |
          docker build -f docker/docs.Dockerfile -t databackup-docs .
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            databackup-docs bash scripts/docs/build-docs.sh

      - name: Assemble artifacts
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          mkdir -p dist/stage
          cp backend/bin/databackup LICENSE README.md dist/stage/
          tar -czf "dist/databackup-${VER}-linux-x86_64.tar.gz" -C dist/stage \
            databackup LICENSE README.md
          rm -rf dist/stage
          git archive --format=tar.gz -o "dist/databackup-${VER}-source.tar.gz" HEAD
          cp client/release/*.AppImage client/release/*.deb dist/
          cp docs/pdf/*.pdf dist/ 2>/dev/null || true
          (cd dist && sha256sum * > sha256sums.txt)
          # NB: build/ is root-owned here (created by the docs step's docker
          # container), so release notes go to RUNNER_TEMP instead.
          bash scripts/release/changelog-section.sh "$VER" > "$RUNNER_TEMP/release-notes.md" || \
            echo "Release $TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          args=(--title "DataBackup $TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          case "$TAG" in *-*) args+=(--prerelease);; esac
          gh release create "$TAG" "${args[@]}" dist/*
